# YAVE render distance settings
#
# lod0: full-resolution band  (chunks 0 .. lod0)
# lod1: surface-mesher band   (chunks lod0 .. lod0+lod1, same quality as lod0)
# lod2: unused (set to 0)
#
# render_distance = lod0 + lod1

lod0 = 20
lod1 = 30
lod2 = 0

# Terrain noise density: > 1.0 = denser/busier terrain, < 1.0 = smoother.
# Temporary global control until biome-specific noise exists.
noise_density = 1.0
